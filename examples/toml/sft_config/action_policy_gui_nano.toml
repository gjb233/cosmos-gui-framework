# Cosmos3-Nano GUI WAM: native video and FM action generation.
[job]
task = "vfm"
experiment = "action_policy_gui_nano"
project = "cosmos3_gui"
group = "action_fm"
name = "androidcontrol_gui_nano_h1"
wandb_mode = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 2.0e-05

[scheduler]
cycle_lengths = [10000]

[dataloader_train]
max_samples_per_batch = 1

[trainer]
max_iter = 1000
logging_iter = 10
grad_accum_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 100
